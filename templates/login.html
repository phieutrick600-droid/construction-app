<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - LÒ KHẢI CONSTRUCTION</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            padding: 30px;
        }
        .nav-pills .nav-link.active {
            background-color: #1e3c72;
        }
        .nav-pills .nav-link {
            color: #1e3c72;
            font-weight: 600;
        }
        .btn-custom {
            background-color: #1e3c72;
            color: white;
            font-weight: 600;
        }
        .btn-custom:hover {
            background-color: #2a5298;
            color: white;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h4 class="text-center fw-bold text-primary mb-1" style="color: #1e3c72 !important;">🏗️ LÒ KHẢI CONSTRUCTION</h4>
    <p class="text-center text-muted small mb-4">Hệ Thống Quản Lý Doanh Nghiệp & Xây Dựng</p>

    <!-- Khung thông báo lỗi / thành công -->
    <div id="alert-box" class="alert d-none text-center py-2 small" role="alert"></div>

    <!-- Tabs Đăng Nhập / Đăng Ký -->
    <ul class="nav nav-pills nav-justified mb-3" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Đăng Nhập</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab">Đăng Ký</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        <!-- FORM ĐĂNG NHẬP -->
        <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
            <form id="form-login">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Email đăng nhập</label>
                    <input type="email" id="login-email" class="form-control" placeholder="nhapemail@gmail.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Mật khẩu</label>
                    <input type="password" id="login-password" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-custom">ĐĂNG NHẬP</button>
                </div>
            </form>
        </div>

        <!-- FORM ĐĂNG KÝ -->
        <div class="tab-pane fade" id="pills-register" role="tabpanel">
            <form id="form-register">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Họ và tên</label>
                    <input type="text" id="reg-fullname" class="form-control" placeholder="Ví dụ: Lò Văn Khải" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Email đăng ký</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="taoemail@gmail.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Mật khẩu</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Tạo mật khẩu (tối thiểu 6 ký tự)" required>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-custom">ĐĂNG KÝ TÀI KHOẢN</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- TÍCH HỢP FIREBASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAk5Li2EigAdX58FuoSyg2hh6sPv2xila4",
      authDomain: "khailoconstruction.firebaseapp.com",
      projectId: "khailoconstruction",
      storageBucket: "khailoconstruction.firebasestorage.app",
      messagingSenderId: "797001552023",
      appId: "1:797001552023:web:bf1a52249333b2559319d2",
      measurementId: "G-42CDGZQZP9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function showAlert(msg, type='danger') {
        const alertBox = document.getElementById('alert-box');
        alertBox.className = `alert alert-${type} text-center py-2 small`;
        alertBox.innerText = msg;
        alertBox.classList.remove('d-none');
    }

    // XỬ LÝ ĐĂNG KÝ
    document.getElementById('form-register').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        try {
            await createUserWithEmailAndPassword(auth, email, password);
            showAlert("Đăng ký thành công! Hãy chuyển sang tab Đăng Nhập.", "success");
        } catch (error) {
            showAlert("Lỗi đăng ký: " + error.message);
        }
    });

    // XỬ LÝ ĐĂNG NHẬP
    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            showAlert("Đăng nhập thành công! Đang chuyển giao diện...", "success");
            setTimeout(() => {
                // Điều hướng sang trang chính sau khi đăng nhập
                window.location.href = "/"; 
            }, 800);
        } catch (error) {
            showAlert("Đăng nhập thất bại: Kiểm tra lại Email/Mật khẩu hoặc Tạo tài khoản trước!");
        }
    });
</script>

</body>
</html>
