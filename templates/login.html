<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - LÒ KHẢI CONSTRUCTION</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            padding: 30px;
        }
        .nav-pills .nav-link.active {
            background-color: #1e3c72;
        }
        .nav-pills .nav-link {
            color: #1e3c72;
            font-weight: 600;
        }
        .btn-custom {
            background-color: #1e3c72;
            color: white;
            font-weight: 600;
        }
        .btn-custom:hover {
            background-color: #2a5298;
            color: white;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h4 class="text-center fw-bold text-primary mb-1" style="color: #1e3c72 !important;">🏗️ LÒ KHẢI CONSTRUCTION</h4>
    <p class="text-center text-muted small mb-4">Hệ Thống Quản Lý Doanh Nghiệp & Xây Dựng</p>

    <!-- Thông báo lỗi / thành công -->
    {% if msg %}
    <div class="alert alert-{{ msg_type }} text-center py-2 small" role="alert">
        {{ msg }}
    </div>
    {% endif %}

    <!-- Tabs Đăng Nhập / Đăng Ký -->
    <ul class="nav nav-pills nav-justified mb-3" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link {% if active_tab != 'register' %}active{% endif %}" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Đăng Nhập</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link {% if active_tab == 'register' %}active{% endif %}" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab">Đăng Ký</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        <!-- FORM ĐĂNG NHẬP -->
        <div class="tab-pane fade {% if active_tab != 'register' %}show active{% endif %}" id="pills-login" role="tabpanel">
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control" placeholder="Nhập username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-custom">ĐĂNG NHẬP</button>
                </div>
            </form>
        </div>

        <!-- FORM ĐĂNG KÝ -->
        <div class="tab-pane fade {% if active_tab == 'register' %}show active{% endif %}" id="pills-register" role="tabpanel">
            <form action="/register" method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Họ và tên</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Ví dụ: Lò Văn Khải" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control" placeholder="Tạo username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" placeholder="Tạo mật khẩu" required>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-custom">ĐĂNG KÝ TÀI KHOẢN</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
